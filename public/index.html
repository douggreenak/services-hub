<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#006a6a">
<title>Services Hub</title>
<link rel="icon" type="image/svg+xml" href="/icons/hub.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,300..900&display=swap" rel="stylesheet">
<style>
/* Material 3 Expressive: tonal color roles, big shapes, springy motion */
:root{
  --primary:#006a6a;--on-primary:#ffffff;--primary-c:#9cf1f0;--on-primary-c:#002020;
  --secondary-c:#cce8e7;--on-secondary-c:#051f1f;
  --tertiary-c:#d4e3ff;--on-tertiary-c:#0c1d36;
  --surface:#f4fafa;--surf-low:#eef5f4;--surf:#e9efef;--surf-high:#e3e9e9;--surf-top:#dde4e3;
  --on-surface:#161d1d;--on-var:#3f4948;--outline:#6f7979;--outline-v:#bec8c8;
  --ok:#146c2e;--ok-c:#b7f1c0;--bad:#ba1a1a;--bad-c:#ffdad6;--on-bad-c:#410002;
  --spring:cubic-bezier(.34,1.56,.64,1);--emph:cubic-bezier(.2,0,0,1);
  --font:"Roboto Flex",system-ui,sans-serif;
}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){
  --primary:#80d4d3;--on-primary:#003737;--primary-c:#004f50;--on-primary-c:#9cf1f0;
  --secondary-c:#324b4b;--on-secondary-c:#cce8e7;
  --tertiary-c:#324863;--on-tertiary-c:#d4e3ff;
  --surface:#0e1415;--surf-low:#161d1d;--surf:#1a2121;--surf-high:#252b2b;--surf-top:#303636;
  --on-surface:#dde4e3;--on-var:#bec8c8;--outline:#899392;--outline-v:#3f4948;
  --ok:#9bd5a4;--ok-c:#00531d;--bad:#ffb4ab;--bad-c:#690005;--on-bad-c:#ffdad6;}}
:root[data-theme=dark]{
  --primary:#80d4d3;--on-primary:#003737;--primary-c:#004f50;--on-primary-c:#9cf1f0;
  --secondary-c:#324b4b;--on-secondary-c:#cce8e7;
  --tertiary-c:#324863;--on-tertiary-c:#d4e3ff;
  --surface:#0e1415;--surf-low:#161d1d;--surf:#1a2121;--surf-high:#252b2b;--surf-top:#303636;
  --on-surface:#dde4e3;--on-var:#bec8c8;--outline:#899392;--outline-v:#3f4948;
  --ok:#9bd5a4;--ok-c:#00531d;--bad:#ffb4ab;--bad-c:#690005;--on-bad-c:#ffdad6;}
:root{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){color-scheme:dark}}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--surface);color:var(--on-surface);font:400 16px/1.5 var(--font);-webkit-font-smoothing:antialiased}
main{max-width:1040px;margin:0 auto;padding:28px 20px 120px}
a{color:inherit}
/* Hero */
.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin:8px 0 28px;padding:32px 28px;border-radius:40px;background:var(--primary-c);color:var(--on-primary-c);position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-60px;top:-70px;width:220px;height:220px;background:var(--tertiary-c);opacity:.7;border-radius:50%}
.hero>*{position:relative;z-index:1}
.hero h1{margin:0;font-size:clamp(36px,7vw,60px);line-height:1.02;font-weight:800;letter-spacing:-.02em;font-variation-settings:"wdth" 110}
.hero p{margin:6px 0 0;font-size:16px;opacity:.85}
.hero .count{display:inline-flex;gap:6px;margin-top:14px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 14px;border-radius:12px;background:var(--surface);color:var(--on-surface);font-size:13px;font-weight:600}
/* Buttons */
.btn{font:600 14px var(--font);letter-spacing:.01em;height:48px;padding:0 24px;border:0;border-radius:24px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;
  background:var(--surf-high);color:var(--primary);transition:border-radius .35s var(--spring),transform .35s var(--spring),background .2s,box-shadow .2s}
.btn:hover{border-radius:14px;background:var(--surf-top)}
.btn:active{border-radius:10px;transform:scale(.95)}
.btn:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
.btn.fill{background:var(--primary);color:var(--on-primary)}.btn.fill:hover{box-shadow:0 2px 10px #0004}
.btn.tonal{background:var(--secondary-c);color:var(--on-secondary-c)}
.btn.text{background:transparent;color:var(--primary);padding:0 14px}.btn.text:hover{background:var(--surf-top)}
.btn.text.quiet{color:var(--on-var);font-weight:500}
.btn.sm{height:40px;padding:0 18px;border-radius:20px}
.btn.err{background:var(--bad-c);color:var(--on-bad-c)}
.fab{position:fixed;right:24px;bottom:24px;height:64px;padding:0 28px 0 22px;border-radius:24px;font-size:16px;background:var(--tertiary-c);color:var(--on-tertiary-c);box-shadow:0 4px 14px #0004;z-index:5}
.fab:hover{background:var(--tertiary-c);filter:brightness(.96);border-radius:32px}
.plus{font-size:26px;font-weight:400;line-height:1}
.theme{position:fixed;top:16px;right:16px;z-index:6;width:48px;height:48px;padding:0;border-radius:24px;background:var(--surf-high);color:var(--on-surface);box-shadow:0 2px 8px #0003}
.theme svg{width:22px;height:22px;fill:currentColor}
.theme.lo{right:76px}
.theme.qr{right:136px}
.qrbox{background:#fff;border-radius:24px;padding:14px;margin:16px auto 8px;width:min(300px,80vw);aspect-ratio:1}
.qrbox svg{display:block;width:100%;height:100%}
.qrurl{text-align:center;font-size:13px;color:var(--on-var);word-break:break-all;margin:6px 0 4px}
.theme[hidden]{display:none}
.authcard{max-width:420px;margin:12vh auto 0;background:var(--surf);border-radius:40px;padding:36px 28px;text-align:center}
.authcard img{width:72px;height:72px;border-radius:50%}
.authcard h1{margin:14px 0 4px;font-size:32px;font-weight:800;letter-spacing:-.02em}
.authcard p{margin:0 0 18px;color:var(--on-var);font-size:14px}
.authcard .field{text-align:left}
.authcard .btn{width:100%;margin-top:18px}
/* Expressive background for the sign-in screen: drifting, morphing tonal shapes */
.authbg{position:fixed;inset:0;overflow:hidden;z-index:0;pointer-events:none}
main{position:relative;z-index:1}
.shp{position:absolute;opacity:.85;animation:drift var(--d,66s) ease-in-out infinite alternate,morph2 var(--m,42s) ease-in-out infinite alternate}
.shp.a{width:78vmin;height:78vmin;left:-24vmin;top:-22vmin;background:var(--primary-c);--d:78s;--m:48s}
.shp.b{width:58vmin;height:58vmin;right:-20vmin;top:-6vmin;background:var(--tertiary-c);--d:60s;--m:36s;animation-delay:-4s}
.shp.c{width:84vmin;height:84vmin;right:-16vmin;bottom:-40vmin;background:var(--secondary-c);--d:84s;--m:54s;animation-delay:-9s}
.shp.g{width:56vmin;height:56vmin;left:-14vmin;bottom:-26vmin;background:var(--primary-c);opacity:.6;border-radius:24%;--d:90s;animation-name:drift,spin;animation-duration:90s,180s;animation-timing-function:ease-in-out,linear;animation-iteration-count:infinite;animation-direction:alternate,reverse}
@keyframes drift{from{transform:translate(0,0) rotate(0deg) scale(1)}to{transform:translate(5vmin,7vmin) rotate(18deg) scale(1.08)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes morph2{0%{border-radius:50%}25%{border-radius:62% 38% 46% 54%/55% 41% 59% 45%}50%{border-radius:30% 70% 62% 38%/48% 56% 44% 52%}75%{border-radius:45% 55% 30% 70%/60% 35% 65% 40%}100%{border-radius:38% 62% 55% 45%/42% 58% 42% 58%}}
@media(prefers-reduced-motion:reduce){.shp{animation:none!important}}
.boot{display:grid;place-items:center;min-height:70vh}
.wheel{width:44px;height:44px;border-radius:50%;border:5px solid var(--primary-c);border-top-color:var(--primary);animation:spin .9s linear infinite}
/* Sections */
.sec{margin:34px 4px 14px;font-size:22px;font-weight:700;letter-spacing:-.005em;display:flex;align-items:center;gap:10px}
.sec small{font:600 13px var(--font);color:var(--on-var);background:var(--surf-high);border-radius:10px;padding:2px 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
/* Cards */
.rendered .card{animation:none}
.card{background:var(--surf);border-radius:28px;padding:20px;display:flex;flex-direction:column;gap:14px;transition:transform .45s var(--spring),background .2s;animation:pop .55s var(--spring) backwards}
.card:hover{background:var(--surf-high);transform:translateY(-4px)}
@keyframes pop{from{opacity:0;transform:scale(.88) translateY(14px)}}
.head{display:flex;gap:14px;align-items:center}
.avatar{width:56px;height:56px;flex:none;display:grid;place-items:center;font-size:24px;font-weight:800;background:var(--primary-c);color:var(--on-primary-c);transition:border-radius .4s var(--emph)}
.avatar{border-radius:50%;position:relative;overflow:hidden}
.avatar img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.card:hover .avatar,.detail .avatar{border-radius:12px}
.t1{background:var(--secondary-c);color:var(--on-secondary-c)}.t2{background:var(--tertiary-c);color:var(--on-tertiary-c)}
.head h3{margin:0;font-size:19px;font-weight:700;line-height:1.2}
.head h3 a{text-decoration:none}.head h3 a:hover{text-decoration:underline}
.badge{display:inline-flex;align-items:center;gap:6px;margin-top:4px;font-size:12px;font-weight:600;height:24px;padding:0 10px;border-radius:8px;background:var(--bad-c);color:var(--on-bad-c)}
.badge.up{background:var(--ok-c);color:var(--ok)}
.badge i{width:7px;height:7px;border-radius:50%;background:currentColor}
.badge.up i{animation:pulse 2s infinite}@keyframes pulse{50%{opacity:.35;transform:scale(1.5)}}
.desc{color:var(--on-var);font-size:14px;flex:1}.url{font-size:12px;color:var(--outline);word-break:break-all}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.sp{flex:1}
.iconb{width:40px;height:40px;padding:0}
/* Detail */
.back{display:inline-flex;margin-bottom:14px}
.detail{background:var(--surf);border-radius:40px;padding:28px}
.detail h1{margin:0 0 4px;font-size:clamp(30px,6vw,48px);font-weight:800;letter-spacing:-.02em;line-height:1.05}
.facts{display:grid;gap:10px;margin:22px 0}
.fact{background:var(--surf-low);border-radius:20px;padding:14px 18px}
.fact dt{font-size:12px;font-weight:600;color:var(--on-var);text-transform:uppercase;letter-spacing:.08em}
.fact dd{margin:2px 0 0;word-break:break-word}
code{background:var(--surf-high);padding:2px 8px;border-radius:8px;font-size:13px}
/* Dialog */
dialog{border:0;border-radius:36px;background:var(--surf-high);color:var(--on-surface);width:min(500px,94vw);padding:28px;animation:dlg .45s var(--spring)}
dialog::backdrop{background:#0006;backdrop-filter:blur(3px)}@keyframes dlg{from{opacity:0;transform:scale(.85)}}
dialog h3{margin:0 0 6px;font-size:26px;font-weight:700}
.field{display:block;position:relative;margin-top:14px}
.field span{position:absolute;left:16px;top:-9px;padding:0 6px;font-size:12px;font-weight:600;color:var(--primary);background:var(--surf-high);border-radius:6px}
select{width:100%;font:inherit;padding:16px;border-radius:16px;border:2px solid var(--outline);background:transparent;color:var(--on-surface)}
select option{background:var(--surf-high);color:var(--on-surface)}
input[type=password],input[type=text],textarea{width:100%;font:inherit;padding:16px;border-radius:16px;border:2px solid var(--outline);background:transparent;color:var(--on-surface);transition:border-color .2s,border-radius .3s var(--spring)}
input[type=password]:focus,input[type=text]:focus,textarea:focus,select:focus{outline:0;border-color:var(--primary);border-radius:24px}
.hint{font-size:12px;color:var(--on-var);margin:4px 8px 0}
.switch{display:flex;align-items:center;gap:14px;margin-top:18px;cursor:pointer;font-size:15px}
.switch input{appearance:none;width:52px;height:32px;border-radius:16px;border:2px solid var(--outline);background:var(--surf-top);position:relative;cursor:pointer;flex:none;transition:background .25s,border-color .25s}
.switch input:after{content:"";position:absolute;left:6px;top:6px;width:16px;height:16px;border-radius:50%;background:var(--outline);transition:all .35s var(--spring)}
.switch input:checked{background:var(--primary);border-color:var(--primary)}
.switch input:checked:after{left:24px;top:2px;width:24px;height:24px;background:var(--on-primary)}
.errmsg{color:var(--bad);font-size:14px;min-height:20px;margin-top:10px}
.foot{display:flex;gap:8px;margin-top:10px;align-items:center}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(max-width:560px){.hero{padding:26px 20px;border-radius:32px}.fab span.lbl{display:none}.fab{padding:0 20px}}
</style><link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Services Hub">
<script src="/pwa.js" defer></script>
</head><body><main id="app"><div class="boot"><div class="wheel" role="status" aria-label="Loading"></div></div></main>
<button class="btn theme qr" id="qrbtn" aria-label="Show QR code" title="QR code for this page" hidden><svg viewBox="0 0 24 24"><path fill-rule="evenodd" d="M3 3h8v8H3zm2 2v4h4V5zM13 3h8v8h-8zm2 2v4h4V5zM3 13h8v8H3zm2 2v4h4v-4zM13 13h3v3h-3zM18 13h3v3h-3zM13 18h3v3h-3zM18 18h3v3h-3z"/></svg></button>
<button class="btn theme lo" id="logout" aria-label="Sign out" title="Sign out" hidden><svg viewBox="0 0 24 24"><path d="M10 4H5v16h5v-2H7V6h3zm5.6 3.6L14.2 9l2 2H9v2h7.2l-2 2 1.400 1.400L20 12z"/></svg></button>
<button class="btn theme" id="theme" aria-label="Toggle light/dark mode" title="Toggle light/dark mode"></button>
<button class="btn fab" id="add"><span class="plus">+</span><span class="lbl">Add site</span></button>
<dialog id="qrdlg"><h3 style="text-align:center;margin:0">Scan to open the hub</h3>
<div class="qrbox" id="qrbox"></div><div class="qrurl" id="qrurl"></div>
<div class="foot" style="justify-content:center;margin-top:14px"><button type="button" class="btn sm" id="qrcopy">Copy link</button><button type="button" class="btn fill sm" id="qrclose">Close</button></div></dialog>
<dialog id="dlg"><form id="form" method="dialog">
<h3 id="dtitle"></h3>
<label class="field"><span>Name</span><input type="text" id="f-name" required></label>
<label class="field"><span>URL</span><input type="text" id="f-url" placeholder="http://{host}:3000" required></label>
<div class="hint">Use <code>{host}</code> for this machine's address.</div>
<label class="field"><span>Description</span><input type="text" id="f-desc"></label>
<label class="field"><span>Icon URL (optional)</span><input type="text" id="f-icon" placeholder="/icons/my-site.svg"></label>
<label class="field"><span>Auto-login</span><select id="f-lmode"><option value="none">None</option><option value="cookie">Password only (session cookie)</option><option value="token">Username + password (token)</option></select></label>
<div id="lbox" hidden>
<label class="field" id="lu"><span>Login username</span><input type="text" id="f-luser" autocomplete="off"></label>
<label class="field"><span>Login password</span><input type="password" id="f-lpass" autocomplete="new-password" placeholder="Leave blank to keep the saved one"></label>
<label class="field"><span>Login path (optional)</span><input type="text" id="f-lpath" placeholder="/api/login"></label>
<div class="hint">Stored encrypted on the hub. Clicking Open signs you in automatically.</div></div>
<label class="field"><span>Project directory</span><input type="text" id="f-dir"></label>
<label class="field"><span>Notes</span><textarea id="f-notes" rows="3"></textarea></label>
<label class="switch"><input type="checkbox" id="f-ctl"><div>We control this service<div class="hint" style="margin:0">Shows an Apps button on the card</div></div></label>
<div class="errmsg" id="err"></div>
<div class="foot"><button type="button" id="del" class="btn err sm">Delete</button><span class="sp"></span><button type="button" id="cancel" class="btn sm">Cancel</button><button class="btn fill sm" id="save">Save</button></div>
</form></dialog>
<script src="/vendor/qrcode.min.js"></script>
<script>
const $=s=>document.querySelector(s), app=$('#app'), dlg=$('#dlg'), qrdlg=$('#qrdlg');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const href=u=>u.replace('{host}',location.hostname);
let services=[], editing=null;
async function api(method,url,body){
  const r=await fetch(url,{method,headers:{'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});
  const j=await r.json(); if(r.status===401&&!url.startsWith('/api/auth/')){showAuth();throw new Error('login required');}
  if(!r.ok) throw new Error(j.error||'Request failed'); return j;
}
const LOGO='<img src="/icons/hub.svg" alt="">';
const BG='<div class="authbg" aria-hidden="true"><div class="shp a"></div><div class="shp b"></div><div class="shp c"></div><div class="shp g"></div></div>';
async function showAuth(){
  const st=await api('GET','/api/auth/status'), setup=st.setup;
  $('#add').hidden=true; $('#logout').hidden=true; $('#qrbtn').hidden=true; services=[]; lastKey=null;
  if(!document.querySelector('.authbg')) document.body.insertAdjacentHTML('afterbegin',BG);
  app.innerHTML=`<form class="authcard" id="authform">${LOGO}<h1>Services Hub</h1>
  <p>${setup?'Create a password. You will sign in once here and the hub signs you in to the other services.':'Sign in once to open every service.'}</p>
  <label class="field"><span>${setup?'New password (4+ characters)':'Password'}</span><input type="password" id="a-pw" autocomplete="${setup?'new-password':'current-password'}" required autofocus></label>
  ${setup?'<label class="field"><span>Confirm password</span><input type="password" id="a-pw2" autocomplete="new-password" required></label>':''}
  <div class="errmsg" id="a-err"></div><button class="btn fill">${setup?'Create password':'Sign in'}</button></form>`;
  $('#authform').onsubmit=async e=>{
    e.preventDefault();
    if(setup&&$('#a-pw').value!==$('#a-pw2').value){$('#a-err').textContent='Passwords do not match';return;}
    try{await api('POST',setup?'/api/auth/setup':'/api/auth/login',{password:$('#a-pw').value}); if(nextUrl()) return location.replace(nextUrl()); load().then(openFromQuery);}
    catch(x){$('#a-err').textContent=x.message;}
  };
}
// QR code of the hub's apps page. A phone can't reach "localhost", so then use the machine's LAN address.
async function hubLink(){
  const local=/^(localhost|127\.|\[?::1)/.test(location.hostname);
  if(local){ try{ const i=await api('GET','/api/info'); if(i.lanUrl) return i.lanUrl; }catch{} }
  return location.origin+'/apps';
}
$('#qrbtn').onclick=async()=>{
  const url=await hubLink(), q=qrcode(0,'M'); q.addData(url); q.make();
  const n=q.getModuleCount(), m=2; let d='';
  for(let r=0;r<n;r++)for(let c=0;c<n;c++) if(q.isDark(r,c)) d+=`M${c+m} ${r+m}h1v1h-1z`;
  $('#qrbox').innerHTML=`<svg viewBox="0 0 ${n+2*m} ${n+2*m}" shape-rendering="crispEdges" role="img" aria-label="QR code for ${esc(url)}"><path d="${d}" fill="#111"/></svg>`;
  $('#qrurl').textContent=url; qrdlg.showModal();
};
$('#qrclose').onclick=()=>qrdlg.close();
$('#qrcopy').onclick=async()=>{try{await navigator.clipboard.writeText($('#qrurl').textContent); $('#qrcopy').textContent='Copied';}catch{} setTimeout(()=>$('#qrcopy').textContent='Copy link',1500);};
$('#logout').onclick=async()=>{await api('POST','/api/auth/logout'); showAuth();};
let lastKey=null;
const keyOf=l=>JSON.stringify(l.map(({up,...x})=>x));
function patchStatus(){
  services.forEach(s=>document.querySelectorAll('[data-badge="'+s.id+'"]').forEach(b=>{
    b.classList.toggle('up',s.up); b.lastChild.textContent=s.up?'Running':'Not responding';}));
  const c=$('#upcount'); if(c) c.textContent=services.filter(s=>s.up).length+' running';
}
async function load(){
  let data; try{data=await api('GET','/api/services');}catch(e){if(e.message==='login required')return; throw e;}
  $('#add').hidden=false; $('#logout').hidden=false; $('#qrbtn').hidden=false; document.querySelector('.authbg')?.remove();
  const k=keyOf(data);
  services=data;
  // Same content as before: update status badges in place, no re-render (no flash)
  if(k===lastKey){ patchStatus(); return; }
  lastKey=k; route(); setTimeout(()=>app.classList.add('rendered'),1200);
}
const hash=s=>[...s.id].reduce((a,c)=>a+c.charCodeAt(0),0);
const badge=s=>`<span class="badge ${s.up?'up':''}" data-badge="${esc(s.id)}"><i></i>${s.up?'Running':'Not responding'}</span>`;
const avatar=s=>{const h=hash(s);return `<div class="avatar t${h%3}"><span>${esc(s.name.trim().charAt(0).toUpperCase())}</span>${s.icon?`<img src="${esc(href(s.icon))}" alt="" onerror="this.remove()">`:''}</div>`};
function card(s,i){
  return `<div class="card" style="animation-delay:${i*45}ms"><div class="head">${avatar(s)}<div>
  <h3><a href="/go/${esc(s.id)}" target="_blank" rel="noopener">${esc(s.name)}</a></h3>${badge(s)}</div></div>
  <div class="desc">${esc(s.description)}</div><div class="url">${esc(href(s.url))}</div>
  <div class="actions"><a class="btn fill sm" href="/go/${esc(s.id)}" target="_blank" rel="noopener">Open</a>
  ${s.controlled?`<a class="btn text sm" href="/apps/${esc(s.id)}">View</a>`:''}<span class="sp"></span>
  <button class="btn text sm quiet" data-edit="${esc(s.id)}">Edit</button></div></div>`;
}
function home(){
  const up=services.filter(s=>s.up).length;
  app.innerHTML=`<section class="hero"><div><h1>Services<br>Hub</h1><p>Every web UI on this machine, one tap away.</p>
  <div class="count"><span class="chip">${services.length} services</span><span class="chip" id="upcount">${up} running</span></div></div></section>
  <div class="grid" style="margin-top:8px">${services.map(card).join('')||'<div class="desc">No services yet.</div>'}</div>`;
  bindEdit();
}
function detail(id){
  const s=services.find(x=>x.id===id);
  if(!s){app.innerHTML='<a class="btn back" href="/">← Back</a><p>Service not found.</p>';return;}
  app.innerHTML=`<a class="btn tonal sm back" href="/">← All services</a>
  <div class="detail"><div class="head" style="margin-bottom:10px">${avatar(s)}<div><h1>${esc(s.name)}</h1>${badge(s)}</div></div>
  <p class="desc">${esc(s.description)}</p>
  <dl class="facts" style="margin-inline:0"><div class="fact"><dt>URL</dt><dd><a href="${esc(href(s.url))}" target="_blank" rel="noopener">${esc(href(s.url))}</a></dd></div>
  <div class="fact"><dt>Directory</dt><dd>${s.dir?`<code>${esc(s.dir)}</code>`:'—'}</dd></div>
  <div class="fact"><dt>Notes</dt><dd>${s.notes?esc(s.notes).replace(/\n/g,'<br>'):'—'}</dd></div></dl>
  <div class="actions"><a class="btn fill" href="/go/${esc(s.id)}" target="_blank" rel="noopener">Open ${esc(s.name)}</a><button class="btn" data-edit="${esc(s.id)}">Edit</button></div></div>`;
  bindEdit();
}
function bindEdit(){app.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openDlg(services.find(s=>s.id===b.dataset.edit)))}
function route(){ const m=location.pathname.match(/^\/apps\/([\w-]+)/); m?detail(m[1]):home(); }
function openDlg(s){
  editing=s; $('#dtitle').textContent=s?'Edit site':'Add site'; $('#err').textContent='';
  $('#f-name').value=s?.name||''; $('#f-url').value=s?.url||''; $('#f-desc').value=s?.description||'';
  $('#f-dir').value=s?.dir||''; const L=s?.login||{}; $('#f-lmode').value=L.mode||'none'; $('#f-luser').value=L.username||''; $('#f-lpass').value=''; $('#f-lpath').value=L.path||''; $('#f-lpass').placeholder=L.hasPassword?'Saved. Leave blank to keep it':'Password'; lbox(); $('#f-icon').value=s?.icon||''; $('#f-notes').value=s?.notes||''; $('#f-ctl').checked=!!s?.controlled;
  $('#del').style.display=s?'':'none'; dlg.showModal();
}
function lbox(){const m=$('#f-lmode').value; $('#lbox').hidden=m==='none'; $('#lu').hidden=m!=='token'; $('#f-lpath').placeholder=m==='token'?'/api/v1/admin/auth/login':'/api/login';}
$('#f-lmode').onchange=lbox;
$('#add').onclick=()=>openDlg(null);
$('#cancel').onclick=()=>dlg.close();
$('#form').onsubmit=async e=>{
  e.preventDefault();
  const b={name:$('#f-name').value,url:$('#f-url').value,description:$('#f-desc').value,dir:$('#f-dir').value,login:{mode:$('#f-lmode').value,username:$('#f-luser').value,path:$('#f-lpath').value,password:$('#f-lpass').value},icon:$('#f-icon').value,notes:$('#f-notes').value,controlled:$('#f-ctl').checked};
  try{ editing?await api('PUT','/api/services/'+editing.id,b):await api('POST','/api/services',b); dlg.close(); load(); }
  catch(x){ $('#err').textContent=x.message; }
};
$('#del').onclick=async()=>{
  if(!confirm('Delete "'+editing.name+'"?'))return;
  await api('DELETE','/api/services/'+editing.id); dlg.close();
  if(location.pathname.startsWith('/apps/')) history.pushState(null,'','/apps'); load();
};

const SUN='<svg viewBox="0 0 24 24"><path d="M12 7a5 5 0 100 10 5 5 0 000-10zM2 13h2v-2H2zm18 0h2v-2h-2zM11 2v2h2V2zm0 18v2h2v-2zM5.6 4.2L4.2 5.6l1.4 1.4 1.4-1.4zm12.8 12.8l-1.4 1.4 1.4 1.4 1.4-1.4zM18.4 7l1.4-1.4-1.4-1.4L17 5.6zM5.6 19.8L7 18.4 5.6 17l-1.4 1.4z"/></svg>';
const MOON='<svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 109 9c0-.5 0-.9-.1-1.4A5.5 5.5 0 0112.4 3.1C12.3 3 12.1 3 12 3z"/></svg>';
const mq=matchMedia('(prefers-color-scheme: dark)');
const saved=()=>{try{return localStorage.getItem('theme')}catch{return null}};
function applyTheme(){
  const t=saved(); if(t) document.documentElement.dataset.theme=t; else delete document.documentElement.dataset.theme;
  const dark=t?t==='dark':mq.matches;
  $('#theme').innerHTML=dark?SUN:MOON;
  document.querySelector('meta[name=theme-color]').content=dark?'#0e1415':'#f4fafa';
}
$('#theme').onclick=()=>{
  const dark=saved()?saved()==='dark':mq.matches;
  try{localStorage.setItem('theme',dark?'light':'dark')}catch{}
  applyTheme();
};
mq.addEventListener('change',applyTheme); applyTheme();
addEventListener('popstate',route);
const qp=new URLSearchParams(location.search);
const nextUrl=()=>{const n=qp.get('next'); return n&&/^\/go\/[\w-]+(\?sso=1)?$/.test(n)?n:null}; // same-site /go paths only
api('GET','/api/auth/status').then(st=>{ if(st.authed&&nextUrl()) return location.replace(nextUrl()); return st.authed?load().then(openFromQuery):showAuth(); });
function openFromQuery(){const e=qp.get('edit'); if(e){const s=services.find(x=>x.id===e); if(s) openDlg(s); history.replaceState(null,'','/');}}
setInterval(()=>{if(!dlg.open&&!$('#authform'))load()},15000);
</script></body></html>
